<div class="pokemon-page">

  <h1> Pokémons</h1>

  <p class="subtitle">
    Pokémons from Kanto, Johto, and Hoenn
  </p>


  <div class="pokemon-container">

    @for (pokemon of pokemonService.pokemon(); track pokemon.id) {

      <div class="pokemon-card">
        
        <div class = "pokemon-image">
          <img src="{{ pokemon.image }}" alt="{{ pokemon.name }}">

        </div>

        <h2>{{ pokemon.name }}</h2>

        <p>
          <strong>Region:</strong>
          {{ pokemon.region }}
        </p>

        <p>
          <strong>Type:</strong>
          {{ pokemon.type }}
        </p>

        <p>
          <strong>Held Item:</strong>
          {{ pokemon.heldItem }}
        </p>

        <p>
          {{ pokemon.description }}
        </p>

      </div>

    }

  </div>

</div>
